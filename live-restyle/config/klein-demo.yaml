edit:
  height: 576
  lightning: true
  model: Qwen/Qwen-Image-Edit-2511
  prompt: Picture 1 is a photo taken inside a surgical training box. Picture 2 is
    a frame of real laparoscopic cholecystectomy video. Redraw picture 1 as real laparoscopic
    surgery footage with exactly the colours, lighting, wet glossy tissue and endoscope
    look of picture 2, while keeping the composition, camera angle and the position,
    shape, size and outline of every object in picture 1 exactly the same. The clear
    plastic bag becomes the glossy grey-green gallbladder covered in fine red blood
    vessels, keeping its seam as a thin fold line. The blue paper becomes glistening
    dark red-brown liver. The beige floor becomes yellow lobulated fat. The orange
    tube becomes a pink cystic duct with tiny vessels. The clear plastic tube becomes
    a pale pinkish-white bile duct. The black sticks become black 5 mm laparoscopic
    graspers with metal jaws at their tips. Endoscope ring light with dark vignette
    at the edges. No plastic, paper, cardboard or text.
  reference: refs/target_style.png
  seed: 7
  steps: 4
  true_cfg: 1.0
  width: 1024
engine: klein
events:
  bile_leak:
    color_bgr:
    - 30
    - 150
    - 150
    growth: 0.08
    instruction: 'Add a {severity} bile leak{where}: green-yellow bile spilling from
      a small hole in the gallbladder wall and running over the tissue.'
    max_radius: 0.18
    opacity: 0.8
    prompt: bile leaking from the gallbladder, green-yellow bile fluid spilling over
      the tissue
    sag: 0.8
    x: 0.5
    y: 0.45
  bleed:
    color_bgr:
    - 18
    - 10
    - 125
    growth: 0.1
    instruction: 'Add {severity} active bleeding{where}: bright red fresh blood oozing
      from a small vessel and pooling over the tissue, as in a real laparoscopic bleed.'
    max_radius: 0.2
    opacity: 0.92
    prompt: active bleeding, bright red blood pooling and oozing over the tissue,
      fresh blood
    prompt_light: small amount of fresh red blood oozing
    pulse_hz: 1.2
    sag: 0.8
    spurt_angle_deg: -35
    x: 0.48
    y: 0.62
  smoke:
    color_bgr:
    - 200
    - 205
    - 210
    density: 0.75
    instruction: Add {severity} white surgical smoke from electrocautery hazing the
      view{where}.
    prompt: surgical smoke from electrocautery, hazy white smoke plume
    x: 0.5
    y: 0.55
gemini:
  aspect_ratio: '16:9'
  concurrency: 1
  expected_s: 14
  image_size: 1K
  input_max_side: 1280
  min_interval_s: 0
  model: gemini-3.1-flash-image
  paused: false
  previous_prompt: Picture 3 is the previous frame of this same video; keep the tissue
    colours, textures, vessels and lighting consistent with it, but follow picture
    1 for every object's position and shape.
  prompt: 'Edit this training-box camera image into photorealistic laparoscopic gallbladder
    surgery. Replace ALL blue paper, blue sponge, blue fabric and blue tape beneath
    and around the green bag with a continuous broad surface of dark reddish-brown
    liver tissue. That entire blue region is the LIVER: smooth rounded organic lobes,
    wet glossy surface, fine vessels, no blue remaining, no paper edges, no fabric,
    no surgical drape. Transform the green plastic bag into ONE anatomically realistic
    gallbladder attached to the liver: a soft rounded pear-shaped sac with a bulbous
    fundus and gently tapering neck, muted grey-green translucent serosa, delicate
    branching red capillaries, subtle uneven tissue texture, tiny yellow fatty attachments
    near its neck, and a thin moist reflective film. Its surface is living tissue
    with fine natural wrinkles and soft irregular highlights, never polished plastic.
    Completely remove the bag''s straight sealed seam, triangular corners, folded
    plastic edges and uniform shiny green surface. Keep the organ centered at the
    bag''s exact position with the same overall size and orientation; round its corners
    into natural soft anatomy. The liver is underneath the gallbladder, not a separate
    organ added on top of it. Replace orange and transparent tubing with pale pink
    ducts and small vessels. Convert the two black sticks into black laparoscopic
    graspers with metal tips at exactly the same positions, angles and tip locations.
    Preserve instrument geometry and camera composition. Surround the organs with
    dark moist abdominal tissue and some yellow fat; conceal the cardboard box and
    all training materials. Real endoscope lighting, wet highlights, dark vignette.
    No text, labels or overlays.'
  reference: null
  seed: null
  temperature: null
  thinking_level: minimal
  use_previous: false
